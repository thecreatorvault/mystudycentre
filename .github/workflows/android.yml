name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: |
          sed -i "s/versionCode 1/versionCode $(( $(date +%s) / 60 ))/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle
          npx cap sync android
      - name: Fullscreen plugin (PDF reader ke liye)
        run: |
          D=android/app/src/main/java/com/studyzone/app
          mkdir -p $D
          cat > $D/ImmersivePlugin.java <<'JAVA'
          package com.studyzone.app;
          import android.view.Window;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "Immersive")
          public class ImmersivePlugin extends Plugin {
            @PluginMethod
            public void enter(PluginCall call) {
              getActivity().runOnUiThread(() -> {
                Window w = getActivity().getWindow();
                WindowCompat.setDecorFitsSystemWindows(w, false);
                WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                c.hide(WindowInsetsCompat.Type.systemBars());
                call.resolve();
              });
            }
            @PluginMethod
            public void exit(PluginCall call) {
              getActivity().runOnUiThread(() -> {
                Window w = getActivity().getWindow();
                WindowCompat.setDecorFitsSystemWindows(w, true);
                WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                c.show(WindowInsetsCompat.Type.systemBars());
                call.resolve();
              });
            }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.studyzone.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ImmersivePlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
      - name: Camera permission (Eye Guard ke liye)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" $M || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera.front" android:required="false" />\n    <application#' $M
          grep -n "CAMERA\|<application" $M
      - name: Fixed signing key (update install ke liye zaroori)
        run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: APK signature (SHA-256 yahan dikhega)
        continue-on-error: true
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: StudyZone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
