<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Study Zone</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#0b1020;--card:#151b30;--card2:#1d2540;--tx:#eef1ff;--mu:#8e98c0;--ac:#7c5cff;--ac2:#22d3a6;--wa:#ffb84d;--rd:#ff6b81}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f3fb;--card:#fff;--card2:#e9ecf8;--tx:#161b33;--mu:#5d678f}}
:root[data-theme="light"]{--bg:#f1f3fb;--card:#fff;--card2:#e9ecf8;--tx:#161b33;--mu:#5d678f}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
#v{max-width:720px;margin:auto;padding:14px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--ac),#2fa8ff);color:#fff}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center}.sp{flex:1}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:var(--card2);color:var(--tx)}button.s{padding:4px 9px;font-size:13px}
input,select{background:var(--card2);color:var(--tx);border:0;border-radius:12px;padding:10px 12px;font:inherit;width:100%}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px #0004;z-index:5}
nav a{flex:1;text-align:center;font-size:11px;color:var(--mu);padding:4px;border-radius:12px;cursor:pointer}
nav a b{display:block;font-size:20px;font-weight:400}nav a.on{color:var(--ac2);background:var(--card2)}
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px}
.t{display:flex;align-items:center;gap:8px;padding:6px 0}.t.d span{text-decoration:line-through;color:var(--mu)}
.t input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac2);flex:none}
.kids{margin-left:14px;border-left:2px solid var(--card2);padding-left:8px}
.ic{background:none;color:var(--mu);padding:2px 6px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chips button{white-space:nowrap}.chips .on{background:var(--ac)}
.wall{columns:2;gap:10px}.wi{break-inside:avoid;margin-bottom:10px;border-radius:16px;overflow:hidden;position:relative;background:var(--card)}
.wi img{width:100%;display:block}.wi p{margin:0;padding:16px;font-weight:700;font-size:17px;background:linear-gradient(135deg,#7c5cff,#ff6b81);color:#fff}
.wi button{position:absolute;top:6px;right:6px;padding:2px 8px}
#md{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
#md div{background:var(--card);padding:18px;border-radius:18px;width:100%;max-width:380px}
.big{font-size:54px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.bk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--card2)}
a{cursor:pointer;color:var(--ac2)}
@keyframes up{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fl{50%{transform:translateY(-7px) rotate(8deg)}}
@keyframes gr{0%{background-position:0 50%}100%{background-position:100% 50%}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
#v.in>*{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
#v.in>*:nth-child(2){animation-delay:.06s}#v.in>*:nth-child(3){animation-delay:.12s}#v.in>*:nth-child(4){animation-delay:.18s}#v.in>*:nth-child(5){animation-delay:.24s}#v.in>*:nth-child(n+6){animation-delay:.3s}
.hero{background:linear-gradient(135deg,#7c5cff,#2fa8ff,#22d3a6,#7c5cff);background-size:300% 300%;animation:gr 9s ease infinite alternate}
.fl{display:inline-block;animation:fl 3s ease-in-out infinite}
button,.btn,.card{transition:transform .15s,background .2s}button:active,.btn:active{transform:scale(.93)}
nav a.on b{animation:pop .45s}.t input:checked{animation:pop .35s}.bar i{transition:width .9s cubic-bezier(.2,.8,.2,1)}
.cfp{position:fixed;width:8px;height:12px;z-index:50;pointer-events:none;animation:cf 1s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#rd{position:fixed;inset:0;background:#2a2f45;z-index:20;display:none;flex-direction:column}
#rd.night{background:#000}#rd.sepia{background:#d9c9a5}
#bx{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
#pgs{display:inline-block;min-width:100%;padding:64px 0 90px;transform-origin:0 0}
.pp{margin:0 auto 14px;background:#fff;box-shadow:0 8px 28px #0009;border-radius:4px;overflow:hidden}
.pp canvas{display:block;width:100%;height:100%}
#rd.night canvas{filter:invert(1) hue-rotate(180deg)}#rd.sepia canvas{filter:sepia(.55) contrast(.95)}
.rt{position:absolute;left:0;right:0;z-index:5;padding:10px;display:flex;gap:8px;align-items:center;background:var(--card);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.rt.t{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}.rt.b{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#rd.hid .rt.t{transform:translateY(-120%)}#rd.hid .rt.b{transform:translateY(120%)}
#sl{padding:0;flex:1;accent-color:var(--ac2);background:none}
</style></head><body>
<div id="v"></div>
<nav id="nv"></nav>
<div id="rd"><div class="bar" style="position:absolute;top:0;left:0;right:0;z-index:6;border-radius:0;height:3px"><i id="rp" style="width:0"></i></div><div class="rt t"><button class="g s" onclick="closeR()">✕</button><b class="sp" id="rtt" style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis"></b><button class="g s" onclick="bmk()" id="bmb">🔖</button><button class="g s" onclick="bml()">📑</button><button class="g s" onclick="rthm()">🌗</button></div><div id="bx"><div id="pgs"></div></div><div class="rt b"><span id="pgn" class="mu" style="min-width:84px">…</span><input type="range" id="sl" min="1" max="1" value="1" oninput="jp(+this.value)"><button class="g s" onclick="zset(1)">Fit</button></div></div>
<div id="md"><div><h2 id="mt"></h2><div id="mb"></div><div class="row" style="margin-top:12px"><button class="g sp" onclick="mc(null)">Cancel</button><button class="sp" onclick="mc(true)">OK</button></div></div></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const N=(t,c=[])=>({id:uid(),t,done:false,open:false,c:c.map(x=>typeof x==='string'?N(x):x)});
const seed=()=>[N('Prelims',[N('History',['Ancient','Medieval','Modern','Bengal History']),N('Geography',['India','West Bengal','World']),N('Polity & Constitution'),N('Economy'),N('Science & Environment'),N('Current Affairs'),N('Maths',['Brahmastra']),N('Reasoning')]),N('Mains',[N('Bengali'),N('English'),N('GS Papers'),N('Essay')]),N('Personality Test')];
let S={};try{S=JSON.parse(localStorage.sz)}catch(e){}
S=Object.assign({goal:'WBCS Officer banna hai',exam:'',tasks:[],tree:seed(),wall:[],books:[],pages:{},mins:{},st:{n:0,last:''}},S);
const save=()=>{try{localStorage.sz=JSON.stringify(S)}catch(e){}};
if(!S.exams){S.exams=[{id:'e1',name:'WBCS',tree:S.tree||seed()}];S.cur='e1'}
delete S.tree;
const cur=()=>S.exams.find(x=>x.id===S.cur)||S.exams[0];
Object.defineProperty(S,'tree',{get:()=>cur().tree,enumerable:false,configurable:true});
if(!S.fo){S.fo=[];const m={};S.books.forEach(b=>{if(b.subj){if(!m[b.subj]){m[b.subj]={id:uid(),n:b.subj,p:''};S.fo.push(m[b.subj])}b.f=m[b.subj].id}})}
const db=new Promise(r=>{try{const q=indexedDB.open('sz',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idb=async(m,k,v)=>{const d=await db;if(!d)return null;return new Promise(r=>{try{const o=d.transaction('f',m==='get'?'readonly':'readwrite').objectStore('f');const q=m==='get'?o.get(k):m==='put'?o.put(v,k):o.delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})};
const Q=["Aaj ka 1 ghanta kal ki officer-ki-kursi hai.","Jo aaj padhega, wahi kal list me naam dekhega.","Discipline motivation se bada hota hai.","Chhote steps roz — bada result ek din.","Thak jao to rest karo, quit mat karo.","Revision hi asli topper banata hai.","Phone side me rakho, future samne rakho.","Tumhari mehnat tumhare parivar ki muskaan hai.","Ek chapter aur. Bas ek aur.","WBCS koi jadu nahi, routine hai.","Success ek din me nahi, roz ke 1% me banti hai.","Aaj ka dard kal ki taaqat hai.","Log sote hain, topper padhte hain.","Jab man na kare tabhi padhna asli jeet hai.","Tumhara competitor abhi padh raha hai.","Selection ke din tum khud pe garv karoge.","Result me der ho sakti hai, andher nahi.","Consistency beats intensity, har baar.","Bahaane mat dhundho, raaste banao.","Har galat answer ek seekh hai, haar nahi.","Aaj ka mock kal ka confidence hai.","Sapne dekhna kaafi nahi, unke liye jaagna padta hai.","Chhota target, pakka kaam, roz.","Jitna paseena padhai me, utna kam pachtawa result me.","Time sabke paas 24 ghante hai — use tum kaise karte ho, wahi farak hai.","Haar tab hoti hai jab tum ruk jaate ho.","Aaj ki mehnat, kal ki pehchaan.","Pehle khud ko jeeto, phir exam ko.","Ek din tum bologe: sab kuch sahi tha, bas tikna tha.","Syllabus bada nahi, tum roz chhota padh rahe ho.","Focus karo: phone nahi, future.","Dard temporary hai, post permanent.","Tum jitna sochte ho usse zyada kar sakte ho.","Aaj bhi ek step aage badho.","Bhaagna nahi hai, bas rukna nahi hai.","Kal ki tension chhodo, aaj ka target pura karo.","Mehnat ka phal der se mile par pakka milta hai.","Padhai boring ho sakti hai, par haar maan'na nahi.","Tum kar sakte ho — aur tum karoge.","Jahan chaah, wahan raah."];
const dn=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5),dq=()=>Q[(dn()*7+(S.qo||0))%Q.length];
function boom(x=innerWidth/2,y=innerHeight/3){for(let i=0;i<24;i++){const d=document.createElement('i');d.className='cfp';d.style.cssText=`left:${x}px;top:${y}px;background:hsl(${Math.random()*360},90%,60%);--x:${(Math.random()-.5)*280}px;--y:${(Math.random()-.9)*280}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}if(navigator.vibrate)navigator.vibrate(30)}
let tab='home';
const TABS=[['home','🏠','Home'],['syl','🌳','Syllabus'],['books','📚','Books'],['wall','🔥','Wall'],['timer','⏱️','Focus']];
function nav(){$('#nv').innerHTML=TABS.map(t=>`<a class="${t[0]===tab?'on':''}" onclick="sw('${t[0]}')"><b>${t[1]}</b>${t[2]}</a>`).join('')}
function sw(t){tab=t;nav();R();scrollTo(0,0);const v=$('#v');v.classList.remove('in');void v.offsetWidth;v.classList.add('in');setTimeout(()=>v.classList.remove('in'),1000)}
function ask(title,def='',opts){return new Promise(res=>{$('#mt').textContent=title;$('#mb').innerHTML=opts?`<select id="mi">${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:`<input id="mi" value="${esc(def)}" ${def==='date'?'':''}>`;if(def==='date')$('#mi').type='date';$('#md').style.display='flex';window.mc=ok=>{const v=$('#mi').value;$('#md').style.display='none';res(ok?v:null)};setTimeout(()=>$('#mi').focus(),50)})}
function find(a,id,p){for(const n of a){if(n.id===id)return{n,a};const r=find(n.c,id);if(r)return r}return null}
const lv=n=>n.c.length?n.c.flatMap(lv):[n];
const pct=n=>{const l=lv(n);return l.length?Math.round(l.filter(x=>x.done).length*100/l.length):0};
const setAll=(n,v)=>{n.done=v;n.c.forEach(x=>setAll(x,v))};
function nodeH(n){const p=pct(n);return`<div><div class="t ${p===100?'d':''}"><span class="ic" onclick="op('${n.id}')" style="width:18px">${n.c.length?(n.open?'▾':'▸'):'•'}</span><input type="checkbox" ${p===100?'checked':''} onchange="ck('${n.id}',this.checked)"><span class="sp" onclick="op('${n.id}')">${esc(n.t)}</span>${n.c.length?`<span class="mu">${p}%</span>`:''}<button class="ic" onclick="ad('${n.id}')">＋</button><button class="ic" onclick="rn('${n.id}')">✎</button><button class="ic" onclick="dl('${n.id}')">✕</button></div>${n.open&&n.c.length?`<div class="kids">${n.c.map(nodeH).join('')}</div>`:''}</div>`}
const op=id=>{const r=find(S.tree,id);r.n.open=!r.n.open;save();R()};
const ck=(id,v)=>{setAll(find(S.tree,id).n,v);if(v&&pct(find(S.tree,id).n)===100)boom();save();R()};
async function ad(id){const t=await ask('Naya topic / sub-topic');if(!t)return;if(id){const r=find(S.tree,id);r.n.c.push(N(t));r.n.open=true}else S.tree.push(N(t));save();R()}
async function rn(id){const r=find(S.tree,id),t=await ask('Naam badlo',r.n.t);if(t){r.n.t=t;save();R()}}
async function dl(id){const r=find(S.tree,id);if(confirm('Delete "'+r.n.t+'"?')){r.a.splice(r.a.indexOf(r.n),1);save();R()}}
function days(){if(!S.exam)return null;return Math.ceil((new Date(S.exam)-new Date(today()))/864e5)}
function bump(){const t=today();if(S.st.last===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.st.n=S.st.last===y?S.st.n+1:1;S.st.last=t}
async function addT(){const i=$('#ti');if(!i.value.trim())return;S.tasks.push({id:uid(),t:i.value.trim(),d:false});save();R()}
function tg(id,v){const t=S.tasks.find(x=>x.id===id);t.d=v;if(v){bump();boom()}save();R()}
async function goal(){const t=await ask('Tumhara goal kya hai?',S.goal);if(t){S.goal=t;save();R()}}
async function exam(){const t=await ask('Exam date','date');if(t){S.exam=t;save();R()}}
function H(){const d=days(),pend=S.tasks.filter(t=>!t.d).length,all=S.tree.flatMap(lv),p=all.length?Math.round(all.filter(x=>x.done).length*100/all.length):0,q=dq(),m=S.mins[today()]||0;
return`<h1>Namaste 👋</h1><div class="mu">${new Date().toLocaleDateString('hi-IN',{weekday:'long',day:'numeric',month:'long'})}</div><br>
<div class="card hero"><div class="mu" style="color:#fffb">MERA GOAL</div><h2 style="font-size:21px;margin:4px 0" onclick="goal()">🎯 ${esc(S.goal)}</h2><div onclick="exam()">${d===null?'Exam date set karo (tap)':d>0?`⏳ Exam me <b>${d}</b> din baaki`:'Exam aa gaya — all the best!'}</div></div>
<div class="card"><div class="row"><span class="mu sp">Aaj ki prerna · roz nayi</span><button class="g s" onclick="S.qo=(S.qo||0)+1;save();R()">🔄</button></div><h2 style="margin-top:8px"><span class="fl">✨</span> “${q}”</h2></div>
<div class="row"><div class="card sp"><div class="mu">Streak</div><h1>🔥 ${S.st.n}</h1></div><div class="card sp"><div class="mu">Aaj padha</div><h1>${m}m</h1></div></div>
<div class="card"><h2>Syllabus progress</h2>${S.exams.map(e=>{const l=e.tree.flatMap(lv),pp=l.length?Math.round(l.filter(x=>x.done).length*100/l.length):0;return`<div style="margin:8px 0"><div class="row"><span class="sp">${esc(e.name)}</span><b>${pp}%</b></div><div class="bar"><i style="width:${pp}%"></i></div></div>`}).join('')}</div>
<div class="card"><h2>📌 Aaj kya padhna hai ${pend?`<span class="mu">(${pend} baaki)</span>`:''}</h2>${S.tasks.map(t=>`<div class="t ${t.d?'d':''}"><input type="checkbox" ${t.d?'checked':''} onchange="tg('${t.id}',this.checked)"><span class="sp">${esc(t.t)}</span><button class="ic" onclick="S.tasks=S.tasks.filter(x=>x.id!=='${t.id}');save();R()">✕</button></div>`).join('')||'<div class="mu">Koi task nahi. Neeche add karo.</div>'}<div class="row" style="margin-top:8px"><input id="ti" placeholder="e.g. Polity Ch-3 padhna" onkeydown="if(event.key==='Enter')addT()"><button onclick="addT()">Add</button></div>${S.tasks.some(t=>t.d)?'<button class="g s" style="margin-top:8px" onclick="S.tasks=S.tasks.filter(x=>!x.d);save();R()">Done wale hatao</button>':''}</div>
<div class="card row"><span class="sp mu">Theme</span><button class="g s" onclick="th()">🌗 Badlo</button>${inst?'<button class="s" onclick="ins()">📲 Install</button>':''}</div>
<div class="mu" style="text-align:center">Phone me install: Chrome menu ⋮ → “Add to Home screen”</div>`}
function th(){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':!matchMedia('(prefers-color-scheme:light)').matches;r.dataset.theme=dk?'light':'dark'}
const TP={'WBCS':seed,'SSC CGL':()=>[N('Quant',['Number System','Percentage','Profit & Loss','Algebra','Geometry','Trigonometry','Mensuration','Data Interpretation']),N('Reasoning',['Analogy','Series','Coding-Decoding','Syllogism','Puzzle']),N('English',['Grammar','Vocabulary','Comprehension','Cloze Test']),N('General Awareness',['History','Geography','Polity','Economy','Science','Current Affairs'])],'UPSC Prelims':()=>[N('GS Paper 1',['History','Geography','Polity','Economy','Environment','Science & Tech','Current Affairs']),N('CSAT')],'Railway NTPC':()=>[N('Maths'),N('Reasoning'),N('General Awareness'),N('General Science')],'Khali (blank)':()=>[]};
async function ae(){const n=await ask('Exam ka naam (jaise SSC CGL)');if(!n)return;const t=await ask('Template chuno',null,Object.keys(TP).filter(k=>k!=='WBCS').concat('WBCS'));if(!t)return;const e={id:uid(),name:n,tree:TP[t]()};S.exams.push(e);S.cur=e.id;save();R()}
async function ee(){const n=await ask('Exam ka naam badlo',cur().name);if(n){cur().name=n;save();R()}}
function de(){if(confirm('"'+cur().name+'" exam aur uska poora syllabus delete?')){S.exams=S.exams.filter(x=>x.id!==cur().id);S.cur=S.exams[0].id;save();R()}}
function SY(){const e=cur();return`<div class="chips">${S.exams.map(x=>`<button class="${x.id===e.id?'':'g'} s" onclick="S.cur='${x.id}';save();R()">${esc(x.name)}</button>`).join('')}<button class="g s" onclick="ae()">＋ Naya exam</button></div><div class="row"><h1 class="sp">${esc(e.name)}</h1><button class="g s" onclick="ee()">✎</button>${S.exams.length>1?'<button class="g s" onclick="de()">🗑</button>':''}<button onclick="ad(null)">＋ Add</button></div><div class="mu" style="margin:6px 0 10px">Har exam ka syllabus alag. ＋ se sub-topic, ✎ rename.</div><div class="card">${e.tree.map(nodeH).join('')||'<div class="mu">Khali hai. Add karo.</div>'}</div>`}
let cf='';
const path=id=>{const a=[];while(id){const f=S.fo.find(x=>x.id===id);if(!f)break;a.unshift(f);id=f.p}return a},fname=id=>path(id).map(f=>f.n).join(' / ');
