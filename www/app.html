function ytList(h){const j=ytData(h);if(!j)throw new Error('YouTube ka jawab samajh nahi aaya (unka page badal gaya ho sakta hai)');const a=[];ytWalk(j,a,0);const seen={};return a.filter(r=>!seen[r.videoId]&&(seen[r.videoId]=1)).map(r=>({vid:r.videoId,t:ytTx(r.title)||'Video',ch:ytTx(r.ownerText)||ytTx(r.longBylineText),d:ytLen(ytTx(r.lengthText)),v:ytTx(r.viewCountText)})).filter(x=>!S.yt.ml||x.d<0||x.d>=180)}
async function ytApiSearch(q){const k=encodeURIComponent(S.yt.key),r=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=25&safeSearch=moderate&q=${encodeURIComponent(q)}&key=${k}`),j=await r.json();if(j.error)throw new Error(j.error.message||'API error');const ids=(j.items||[]).map(x=>x.id.videoId).join(','),dm={};if(ids){const d=await(await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${ids}&key=${k}`)).json();(d.items||[]).forEach(x=>dm[x.id]=ytDur(x.contentDetails.duration))}return(j.items||[]).map(x=>({vid:x.id.videoId,t:ytDec(x.snippet.title),ch:ytDec(x.snippet.channelTitle),d:dm[x.id.videoId]||0,v:''})).filter(x=>!S.yt.ml||x.d>=180)}
async function ytDoSearch(){const e=document.getElementById('ytq'),q=(e?e.value:ytSq).trim();if(!q)return;ytSq=q;ytSt='Search: '+q;ytSb=true;ytSe='';ytSr=[];R();
try{try{ytSr=ytList(await ytGet('https://www.youtube.com/results?search_query='+encodeURIComponent(q)+'&sp=EgIQAQ%3D%3D'))}catch(er){if(S.yt.key)ytSr=await ytApiSearch(q);else throw er}if(!ytSr.length)ytSe='Koi video nahi mila. Dusra shabd try karo.'}catch(er){ytSe='Search nahi hua: '+String(er.message||er)}ytSb=false;R()}
const ytQ=q=>{const e=document.getElementById('ytq');if(e)e.value=q;ytDoSearch()};
async function ytChAdd(){const v=await ask('Channel ka @handle ya link (jaise @StudyIQ)');if(!v)return;let u=v.trim();if(/^@/.test(u))u='https://www.youtube.com/'+u;else if(!/youtube\.com/.test(u))u='https://www.youtube.com/@'+u;u=u.replace(/\/(videos|shorts|streams|featured|playlists)?\/?$/,'');u=u.split('?')[0]+'/videos';
ytSb=true;ytSt='Channel dhoondh raha hai...';ytSe='';R();try{const h=await ytGet(u),m=/<meta property="og:title" content="([^"]*)"/.exec(h),n=m?ytDec(m[1]):v;if(!ytData(h))throw new Error('Channel nahi mila');S.yt.ch.push({id:uid(),n,u});save();ytSb=false;await ytChOpen(S.yt.ch.length-1)}catch(er){ytSb=false;ytSe='Channel nahi jud paya: '+String(er.message||er);R()}}
async function ytChOpen(i){const c=S.yt.ch[i];if(!c)return;ytSq='';ytSt='📺 '+c.n;ytSb=true;ytSe='';ytSr=[];R();try{ytSr=ytList(await ytGet(c.u));if(!ytSr.length)ytSe='Is channel me abhi video nahi mile.'}catch(er){ytSe='Channel load nahi hua: '+String(er.message||er)}ytSb=false;R()}
const ytChDel=i=>{if(confirm('Channel hatana hai?')){S.yt.ch.splice(i,1);save();R()}};
function ytSave(vid){let it=S.yt.it.find(x=>x.vid===vid);if(!it){const x=ytSr.find(a=>a.vid===vid);it={id:uid(),t:x?x.t:'Video',k:'v',vid,subj:S.yt.f==='All'?'General':S.yt.f,pos:0,rate:1};S.yt.it.unshift(it);save();toast('Library me jud gaya ✅');setTimeout(()=>toast(''),1500)}return it}
const ytPlay=vid=>ytOpen(ytSave(vid).id);
function VIDS(){return`<div class="row"><button class="g s" onclick="sw('yt')">‹ Videos</button><h2 class="sp" style="margin:0">YouTube</h2></div><div class="row" style="margin:8px 0"><input id="ytq" placeholder="Search karo (jaise WBCS polity)" value="${esc(ytSq)}" onkeydown="if(event.key==='Enter')ytDoSearch()"><button style="flex:none" onclick="ytDoSearch()">🔎</button></div><div class="chips">${['WBCS Polity','History lecture','Maths tricks','Current affairs','Reasoning','Bengali grammar'].map(x=>`<button class="g s" onclick="ytQ('${x}')">${x}</button>`).join('')}</div>

<div class="chips"><button class="${S.yt.ml?'':'g'} s" onclick="S.yt.ml=S.yt.ml?0:1;save();R()">3 min se chhote (Shorts jaise) hide: ${S.yt.ml?'On':'Off'}</button><button class="g s" onclick="ytApiKey()">🔑 API key (backup)</button></div>
${ytSt?`<div class="mu" style="margin:6px 0">${esc(ytSt)}</div>`:''}${ytSb?'<div class="card mu">Load ho raha hai...</div>':''}${ytSe?`<div class="card" style="color:var(--rd)">${esc(ytSe)}</div>`:''}${ytSr.map(x=>`<div class="card" style="padding:10px"><div class="row" onclick="ytPlay('${x.vid}')" style="cursor:pointer;align-items:flex-start"><img src="https://i.ytimg.com/vi/${x.vid}/mqdefault.jpg" style="width:120px;border-radius:10px;flex:none" alt=""><div class="sp"><b>${esc(x.t)}</b><div class="mu">${esc(x.ch)} · ${x.d<0?'🔴 Live':ytfmt(x.d)}${x.v?' · '+esc(x.v):''}</div></div></div><div class="row" style="margin-top:6px"><button class="s sp" onclick="ytPlay('${x.vid}')">▶ Chalao</button><button class="g s sp" onclick="ytSave('${x.vid}')">＋ Library</button></div></div>`).join('')}${!ytSb&&!ytSe&&!ytSr.length&&!ytSt?'<div class="mu">Upar search karo ya apne favourite channel jodo. Sirf video aate hain, Shorts aur recommendations nahi.</div>':''}<div class="card"><div class="mu">Ye YouTube ke public page se padha jata hai, koi login ya API key nahi. Ads video ke andar YouTube ke hi rehte hain. Video YouTube ke player me chalta hai (speed max 2x). YouTube apna page badle to search kabhi band ho sakta hai; tab 🔑 API key ek backup hai.</div></div>`}

const egB=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function egCas(b64){const u=await unzipB(egB(b64)),dv=new DataView(u.buffer,u.byteOffset,u.byteLength),w=dv.getInt32(0,true),h=dv.getInt32(4,true),nf=dv.getInt32(8,true),nn=dv.getInt32(12,true),ns=dv.getInt32(16,true);let o=u.byteOffset+20;const F=new Float32Array(u.buffer.slice(o,o+nf*60));o+=nf*60;const N=new Float32Array(u.buffer.slice(o,o+nn*16));o+=nn*16;const S=new Float32Array(u.buffer.slice(o,o+ns*12));return{w,h,F,N,S,ns}}
function egInt(g,w,h){const W1=w+1,ii=new Float64Array(W1*(h+1)),sq=new Float64Array(W1*(h+1));for(let y=0;y<h;y++){let r=0,q=0;for(let x=0;x<w;x++){const v=g[y*w+x];r+=v;q+=v*v;ii[(y+1)*W1+x+1]=ii[y*W1+x+1]+r;sq[(y+1)*W1+x+1]=sq[y*W1+x+1]+q}}return{ii,sq,W1,w,h}}
function egWin(c,I,x,y,s){const{ii,sq,W1}=I,w=Math.round(c.w*s),h=Math.round(c.h*s),a=y*W1+x,b=y*W1+x+w,d=(y+h)*W1+x,e=(y+h)*W1+x+w,sum=ii[e]-ii[b]-ii[d]+ii[a],sqs=sq[e]-sq[b]-sq[d]+sq[a],ar=w*h;let vn=sqs*ar-sum*sum;vn=vn>0?Math.sqrt(vn):1;const F=c.F,N=c.N,S=c.S;
for(let k=0;k<c.ns;k++){let ss=0;const n0=S[k*3+1],n1=S[k*3+2];for(let i=n0;i<n1;i++){const o=(N[i*4]|0)*15;let v=0;for(let r=0;r<3;r++){const wt=F[o+r*5+4];if(wt===0)continue;const x0=x+Math.round(F[o+r*5]*s),y0=y+Math.round(F[o+r*5+1]*s),x1=x0+Math.round(F[o+r*5+2]*s),y1=y0+Math.round(F[o+r*5+3]*s);v+=wt*(ii[y1*W1+x1]-ii[y0*W1+x1]-ii[y1*W1+x0]+ii[y0*W1+x0])}ss+=v<N[i*4+1]*vn?N[i*4+2]:N[i*4+3]}
