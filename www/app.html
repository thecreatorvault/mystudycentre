<style>

.seat.rv{background:linear-gradient(135deg,#5b0f1e,#c4223d);color:#fff;animation:sh .6s .15s 2,pu 1.6s infinite}.seat .nm{font-size:26px;font-weight:900;margin:6px 0}.seat .wn{font-weight:900;animation:bl 1s infinite;margin:4px 0}
.live{color:var(--rd);font-weight:800;font-size:12px}.live i,.pd{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rd);margin-right:6px;animation:bl 1s infinite}.gh{display:inline-block;animation:fl 3s ease-in-out infinite}
.stt{padding:10px 12px;border-radius:12px;background:var(--card2);margin-top:8px}.stt.on{border-left:4px solid var(--ac2)}.fi{padding:8px 0;border-bottom:1px solid var(--card2);animation:up .4s both}.fi.warn{color:var(--wa)}
#ovl{position:fixed;inset:0;background:#000c;z-index:65;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}#ovl .box{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:400px;animation:up .45s both}
</style></head><body>
<div id="v"></div>
<nav id="nv"></nav>
<div id="rd"><div id="panes"></div></div>
<div id="md"><div><h2 id="mt"></h2><div id="mb"></div><div class="row" style="margin-top:12px"><button class="g sp" onclick="mc(null)">Cancel</button><button class="sp" onclick="mc(true)">OK</button></div></div></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const N=(t,c=[])=>({id:uid(),t,done:false,open:false,c:c.map(x=>typeof x==='string'?N(x):x)});
const seed=()=>[N('Prelims',[N('History',['Ancient','Medieval','Modern','Bengal History']),N('Geography',['India','West Bengal','World']),N('Polity & Constitution'),N('Economy'),N('Science & Environment'),N('Current Affairs'),N('Maths',['Brahmastra']),N('Reasoning')]),N('Mains',[N('Bengali'),N('English'),N('GS Papers'),N('Essay')]),N('Personality Test')];
let S={};try{S=JSON.parse(localStorage.sz)}catch(e){}
S=Object.assign({goal:'WBCS Officer banna hai',exam:'',tasks:[],tree:seed(),wall:[],books:[],pages:{},mins:{},st:{n:0,last:''}},S);
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.isPluginAvailable&&Capacitor.isPluginAvailable('Filesystem')&&Capacitor.isPluginAvailable('Preferences')),FS=NATIVE&&Capacitor.Plugins.Filesystem,PF=NATIVE&&Capacitor.Plugins.Preferences;
const save=()=>{try{localStorage.sz=JSON.stringify(S)}catch(e){}if(NATIVE){clearTimeout(save.t);save.t=setTimeout(()=>{try{PF.set({key:'sz',value:localStorage.sz||JSON.stringify(S)})}catch(e){}},400)}};
if(!S.exams){S.exams=[{id:'e1',name:'WBCS',tree:S.tree||seed()}];S.cur='e1'}
delete S.tree;
const cur=()=>S.exams.find(x=>x.id===S.cur)||S.exams[0];
Object.defineProperty(S,'tree',{get:()=>cur().tree,enumerable:false,configurable:true});
if(!S.fo){S.fo=[];const m={};S.books.forEach(b=>{if(b.subj){if(!m[b.subj]){m[b.subj]={id:uid(),n:b.subj,p:''};S.fo.push(m[b.subj])}b.f=m[b.subj].id}})}
const db=new Promise(r=>{try{const q=indexedDB.open('sz',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idbOld=async(m,k,v)=>{const d=await db;if(!d)return null;return new Promise(r=>{try{const tx=d.transaction('f',m==='get'||m==='keys'?'readonly':'readwrite'),o=tx.objectStore('f');let res;const q=m==='get'?o.get(k):m==='put'?o.put(v,k):m==='keys'?o.getAllKeys():o.delete(k);q.onsuccess=()=>{res=q.result;if(m==='get'||m==='keys')r(res)};tx.oncomplete=()=>r(res===undefined?1:res);tx.onerror=tx.onabort=()=>r(null)}catch(e){r(null)}})};
const idb0=idbOld;
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
async function nput(k,v){try{const u=new Uint8Array(v.b),C=3145728;for(let o=0;o===0||o<u.length;o+=C){const d=b64(u.subarray(o,o+C));if(o===0)await FS.writeFile({path:'sz/'+k,data:d,directory:'DATA',recursive:true});else await FS.appendFile({path:'sz/'+k,data:d,directory:'DATA'})}return k}catch(e){return null}}
async function nget(k){try{const u=await FS.getUri({path:'sz/'+k,directory:'DATA'}),r=await fetch(Capacitor.convertFileSrc(u.uri));if(!r.ok)return undefined;return{b:await r.arrayBuffer(),t:''}}catch(e){return undefined}}
async function nkeys(){try{return(await FS.readdir({path:'sz',directory:'DATA'})).files.map(f=>f.name)}catch(e){return[]}}
async function nputFile(k,f){try{const C=3145728;for(let o=0;o===0||o<f.size;o+=C){const d=b64(new Uint8Array(await f.slice(o,o+C).arrayBuffer()));if(o===0)await FS.writeFile({path:'sz/'+k,data:d,directory:'DATA',recursive:true});else await FS.appendFile({path:'sz/'+k,data:d,directory:'DATA'});if(f.size>2e7)toast(Math.min(99,Math.round(o*100/f.size))+'% save ho rahi hai')}const st=await FS.stat({path:'sz/'+k,directory:'DATA'});if(st.size!==f.size)throw 0;return k}catch(e){try{await FS.deleteFile({path:'sz/'+k,directory:'DATA'})}catch(x){}return null}}
const putPdf=async(id,f)=>NATIVE?nputFile(id,f):idb('put',id,{b:await f.arrayBuffer(),t:'application/pdf'});
async function ndel(k){try{await FS.deleteFile({path:'sz/'+k,directory:'DATA'})}catch(e){}return 1}
const idb=(m,k,v)=>{if(!NATIVE||k==='__app')return idb0(m,k,v);if(m==='put')return nput(k,v);if(m==='get')return nget(k);if(m==='keys')return nkeys();return ndel(k)};
function toast(t){let e=$('#ts');if(!e){e=document.createElement('div');e.id='ts';e.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card2);color:var(--tx);padding:10px 16px;border-radius:14px;z-index:60;box-shadow:0 4px 20px #0006';document.body.appendChild(e)}e.textContent=t;e.style.display=t?'block':'none'}
let KEYS=null,MISS=new Set();
async function chk(){const k=await idb('keys');if(!Array.isArray(k))return;KEYS=new Set(k);const m=new Set(S.books.filter(b=>!KEYS.has(b.id)).map(b=>b.id)),sig=[...m].join()+'|'+KEYS.size+'|'+S.wall.length;if(sig!==chk.s){chk.s=sig;MISS=m;if(tab==='books'||tab==='wall')R()}}
async function stinfo(){const e=$('#sti');if(!e)return;if(window.Capacitor){const b=e.nextElementSibling;if(b)b.style.display='none';if(!NATIVE){e.textContent='⚠ Ye APK purana hai (v5 wala nahi). Naya APK banao, tab PDFs phone ki memory me save hongi.';return}try{const r=await FS.readdir({path:'sz',directory:'DATA'});e.textContent='✅ Phone ki memory me save ('+r.files.length+' file) · '+(r.files.reduce((a,f)=>a+(f.size||0),0)/1048576).toFixed(1)+' MB'}catch(x){e.textContent='✅ Phone ki memory me save hoga · 0 MB'}return}try{const p=await navigator.storage.persisted(),u=await navigator.storage.estimate();e.textContent=(p?'✅ Pakka: browser data nahi hatayega':'⚠ Kaccha: browser kabhi bhi hata sakta hai. App install karo aur "Pakka karo" dabao')+' · '+Math.round(u.usage/1048576)+' MB use'}catch(x){e.textContent='Storage info nahi mili'}}
async function pers(){if(window.Capacitor){alert('APK me iski zaroorat nahi, data pehle se safe hai ✅');return}try{const ok=await navigator.storage.persist();alert(ok?'Ho gaya ✅ Ab data pakka save rahega':'Browser ne mana kiya. App ko Home screen par install karke use karo.')}catch(e){}stinfo()}
const Q=["Aaj ka 1 ghanta kal ki officer-ki-kursi hai.","Jo aaj padhega, wahi kal list me naam dekhega.","Discipline motivation se bada hota hai.","Chhote steps roz — bada result ek din.","Thak jao to rest karo, quit mat karo.","Revision hi asli topper banata hai.","Phone side me rakho, future samne rakho.","Tumhari mehnat tumhare parivar ki muskaan hai.","Ek chapter aur. Bas ek aur.","WBCS koi jadu nahi, routine hai.","Success ek din me nahi, roz ke 1% me banti hai.","Aaj ka dard kal ki taaqat hai.","Log sote hain, topper padhte hain.","Jab man na kare tabhi padhna asli jeet hai.","Tumhara competitor abhi padh raha hai.","Selection ke din tum khud pe garv karoge.","Result me der ho sakti hai, andher nahi.","Consistency beats intensity, har baar.","Bahaane mat dhundho, raaste banao.","Har galat answer ek seekh hai, haar nahi.","Aaj ka mock kal ka confidence hai.","Sapne dekhna kaafi nahi, unke liye jaagna padta hai.","Chhota target, pakka kaam, roz.","Jitna paseena padhai me, utna kam pachtawa result me.","Time sabke paas 24 ghante hai — use tum kaise karte ho, wahi farak hai.","Haar tab hoti hai jab tum ruk jaate ho.","Aaj ki mehnat, kal ki pehchaan.","Pehle khud ko jeeto, phir exam ko.","Ek din tum bologe: sab kuch sahi tha, bas tikna tha.","Syllabus bada nahi, tum roz chhota padh rahe ho.","Focus karo: phone nahi, future.","Dard temporary hai, post permanent.","Tum jitna sochte ho usse zyada kar sakte ho.","Aaj bhi ek step aage badho.","Bhaagna nahi hai, bas rukna nahi hai.","Kal ki tension chhodo, aaj ka target pura karo.","Mehnat ka phal der se mile par pakka milta hai.","Padhai boring ho sakti hai, par haar maan'na nahi.","Tum kar sakte ho — aur tum karoge.","Jahan chaah, wahan raah."];
const dn=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5),dq=()=>Q[(dn()*7+(S.qo||0))%Q.length];
function boom(x=innerWidth/2,y=innerHeight/3){for(let i=0;i<24;i++){const d=document.createElement('i');d.className='cfp';d.style.cssText=`left:${x}px;top:${y}px;background:hsl(${Math.random()*360},90%,60%);--x:${(Math.random()-.5)*280}px;--y:${(Math.random()-.9)*280}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}if(navigator.vibrate)navigator.vibrate(30)}
let tab='home';
const TABS=[['home','🏠','Home'],['syl','🌳','Syllabus'],['books','📚','Books'],['wall','🔥','Wall'],['timer','⏱️','Focus'],['rival','👨‍🎓','Rival']];
function nav(){$('#nv').innerHTML=TABS.map(t=>`<a class="${t[0]===tab?'on':''}" onclick="sw('${t[0]}')"><b>${t[1]}</b>${t[2]}</a>`).join('')}
function sw(t){tab=t;nav();R();scrollTo(0,0);const v=$('#v');v.classList.remove('in');void v.offsetWidth;v.classList.add('in');setTimeout(()=>v.classList.remove('in'),1000)}
function ask(title,def='',opts){return new Promise(res=>{$('#mt').textContent=title;$('#mb').innerHTML=opts?`<select id="mi">${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:`<input id="mi" value="${esc(def)}" ${def==='date'?'':''}>`;if(def==='date')$('#mi').type='date';$('#md').style.display='flex';window.mc=ok=>{const v=$('#mi').value;$('#md').style.display='none';res(ok?v:null)};setTimeout(()=>$('#mi').focus(),50)})}
function find(a,id,p){for(const n of a){if(n.id===id)return{n,a};const r=find(n.c,id);if(r)return r}return null}
const lv=n=>n.c.length?n.c.flatMap(lv):[n];
const pct=n=>{const l=lv(n);return l.length?Math.round(l.filter(x=>x.done).length*100/l.length):0};
const setAll=(n,v)=>{n.done=v;n.c.forEach(x=>setAll(x,v))};
function nodeH(n){const p=pct(n);return`<div><div class="t ${p===100?'d':''}"><span class="ic" onclick="op('${n.id}')" style="width:18px">${n.c.length?(n.open?'▾':'▸'):'•'}</span><input type="checkbox" ${p===100?'checked':''} onchange="ck('${n.id}',this.checked)"><span class="sp" onclick="op('${n.id}')">${esc(n.t)}</span>${n.c.length?`<span class="mu">${p}%</span>`:''}<button class="ic" onclick="ad('${n.id}')">＋</button><button class="ic" onclick="rn('${n.id}')">✎</button><button class="ic" onclick="dl('${n.id}')">✕</button></div>${n.open&&n.c.length?`<div class="kids">${n.c.map(nodeH).join('')}</div>`:''}</div>`}
const op=id=>{const r=find(S.tree,id);r.n.open=!r.n.open;save();R()};
const ck=(id,v)=>{const nn=find(S.tree,id).n;setAll(nn,v);if(v)nn.rv={d:today(),s:0};else delete nn.rv;if(v&&pct(find(S.tree,id).n)===100)boom();save();R()};
async function ad(id){const t=await ask('Naya topic / sub-topic');if(!t)return;if(id){const r=find(S.tree,id);r.n.c.push(N(t));r.n.open=true}else S.tree.push(N(t));save();R()}
