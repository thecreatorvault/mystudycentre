function find(a,id,p){for(const n of a){if(n.id===id)return{n,a};const r=find(n.c,id);if(r)return r}return null}
const lv=n=>n.c.length?n.c.flatMap(lv):[n];
const pct=n=>{const l=lv(n);return l.length?Math.round(l.filter(x=>x.done).length*100/l.length):0};
const setAll=(n,v)=>{n.done=v;n.c.forEach(x=>setAll(x,v))};

function nodeH(n){
  const p=pct(n);
  return`<div><div class="t ${p===100?'d':''}"><span class="ic" onclick="op('${n.id}')" style="width:18px">${n.c.length?(n.open?'▾':'▸'):'•'}</span><input type="checkbox" ${p===100?'checked':''} onchange="ck('${n.id}',this.checked)"><span class="sp" onclick="op('${n.id}')">${esc(n.t)}</span>${n.c.length?`<span class="mu">${p}%</span>`:''}<button class="ic" onclick="ad('${n.id}')">＋</button><button class="ic" onclick="rn('${n.id}')">✎</button><button class="ic" onclick="dl('${n.id}')">✕</button></div>${n.open&&n.c.length?`<div class="kids">${n.c.map(nodeH).join('')}</div>`:''}</div>`;
}

const ck=(id,v)=>{

  setAll(nn,v);
  if(v){
    nn.rv={d:today(),s:0};
    if(!S.trophies.some(x=>x.id===nn.id)){

function saveDiary(mood){
  const text=($('#diary-input')?$('#diary-input').value.trim():'')||'Focus day';

  const exist=S.diary.find(d=>d.d===today());

}

// QR Code Offline Beam Engine
function generateQRData(){
  const payload={
    v:APP_V,cur:S.cur,exams:S.exams,tasks:S.tasks,mins:S.mins,st:S.st,
    goal:S.goal,exam:S.exam,mk:S.mk,diary:S.diary,trophies:S.trophies,
    ts:Date.now()
  };
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}

function qrExport(){
  const codeStr=generateQRData();
  const url="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data="+encodeURIComponent(codeStr);
  ovl(`<div style="text-align:center"><h2>📡 Offline QR Beam</h2><div class="mu" style="margin-bottom:12px">Dusre device se is QR code ko scan karo ya copy data use karo.</div><div style="background:#fff;padding:12px;border-radius:16px;display:inline-block"><img src="${url}" onerror="this.outerHTML='<div class=\\'mu\\'>QR image offline generate nahi hui, text copy karein</div>'" style="width:230px;height:230px;display:block"></div><div class="row" style="margin-top:12px"><button class="sp" onclick="navigator.clipboard.writeText('${codeStr}');toast('Sync data copied!')">📋 Copy Data String</button><button class="g sp" onclick="ovx()">Band karo</button></div></div>`);
}

function qrImport(){
  ovl(`<div><h2>📥 Import / Sync Data</h2><div class="mu" style="margin-bottom:12px">QR screenshot upload karo ya copy kiya hua data string paste karo.</div><label class="btn" style="display:block;text-align:center;margin-bottom:10px">🖼️ QR Screenshot Chuno<input type="file" accept="image/*" hidden onchange="parseQRImg(this.files[0])"></label><textarea id="sync-raw" rows="4" placeholder="Ya yahan Data string paste karo..."></textarea><div class="row" style="margin-top:12px"><button class="sp" onclick="applySync($('#sync-raw').value.trim())">Sync Apply Karo</button><button class="g sp" onclick="ovx()">Cancel</button></div></div>`);
}

function parseQRImg(file){
  if(!file)return;
  toast('Image upload hui. Agar camera decode na ho to Data String paste karein.');
}

function applySync(str){
  if(!str){alert('Data khali hai');return}
  try{
    const j=JSON.parse(decodeURIComponent(escape(atob(str))));
    if(!j.exams)throw 0;
    Object.assign(S,{exams:j.exams,tasks:j.tasks||[],mins:j.mins||{},st:j.st||S.st,goal:j.goal||S.goal,exam:j.exam||S.exam,mk:j.mk||[],diary:j.diary||[],trophies:j.trophies||[]});
    save();ovx();boom();alert('Sync Successful! 🎉 Saara data update ho gaya.');R();
  }catch(e){alert('Data format galat hai.')}
}

// PDF Reader with Fullscreen Capability
const RS=[];let rz;
function toggleReaderFs(){
  const rd=$('#rd');
  if(!document.fullscreenElement){
    if(rd.requestFullscreen)rd.requestFullscreen();
    else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();
    rd.classList.add('immersive');
    $('#rd-fs-toggle').style.display='flex';
  }else{
    if(document.exitFullscreen)document.exitFullscreen();
    rd.classList.remove('immersive');
    $('#rd-fs-toggle').style.display='none';
  }
}

// Reverse Pomodoro & Focus Studio
const fm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'),RC=339.3,ML={f:'Focus',s:'Short break',l:'Long break'};
S.pm=Object.assign({f:25,s:5,l:15,ev:4,auto:true,goal:120,snd:'off'},S.pm||{});S.log=S.log||[];
const dur=m=>S.pm[m]*60;
let tm={mode:'f',left:dur('f'),full:dur('f'),run:false,end:0,iv:null,tag:'General',n:0},ac,sn,wl2;

function rst(){const t=S.tm;if(t&&t.day===today()){Object.assign(tm,{mode:t.mode,full:dur(t.mode),left:t.left,n:t.n,tag:t.tag||'General'});if(t.run){tm.end=t.end;tm.run=true;tm.iv=setInterval(tick,250);tick()}}}
const saveTm=()=>{S.tm={mode:tm.mode,left:tm.left,run:tm.run,end:tm.end,n:tm.n,tag:tm.tag,day:today()};save()};

function tick(){
  if(tm.run)tm.left=Math.max(0,Math.round((tm.end-Date.now())/1000));
  const e=$('#tm');if(e){e.textContent=fm(tm.left);$('#rg').style.strokeDashoffset=RC*(1-tm.left/tm.full)}
  document.title=tm.run?fm(tm.left)+' · Study Zone':'Study Zone';
  if(tm.run&&tm.left<=0)fin();
}

function start(){
  if(tm.run)return;
  tm.end=Date.now()+tm.left*1000;
  tm.run=true;
  S.revPm.last=Date.now();
  save();
  clearInterval(tm.iv);tm.iv=setInterval(tick,250);
  if(tm.mode==='f')snd(S.pm.snd);
  try{Notification.permission==='default'&&Notification.requestPermission()}catch(e){}
  try{navigator.wakeLock.request('screen').then(w=>wl2=w)}catch(e){}
  saveTm();R();
}

function pause(){clearInterval(tm.iv);tm.run=false;stopS();S.revPm.last=Date.now();save();saveTm();R()}
function nxt(){tm.mode=tm.mode==='f'?(tm.n&&tm.n%S.pm.ev===0?'l':'s'):'f';tm.left=tm.full=dur(tm.mode)}
function tmode(m){pause();tm.mode=m;tm.left=tm.full=dur(m);saveTm();R()}

function fin(){
  clearInterval(tm.iv);tm.run=false;stopS();beep();
  if(tm.mode==='f'){
    const m=S.pm.f;
    S.mins[today()]=(S.mins[today()]||0)+m;
    S.log.push({d:today(),m,t:tm.tag});
    S.log=S.log.slice(-300);
    tm.n++;bump();boom();
  }
  S.revPm.last=Date.now();
  save();
  try{new Notification('Study Zone',{body:tm.mode==='f'?'Focus complete! Break lo 🎉':'Break khatam, padhai shuru!'})}catch(e){}
  nxt();if(S.pm.auto)start();else{saveTm();R()}
}

function beep(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();[0,.3,.6].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.setValueAtTime(.25,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.25);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.26)})}catch(e){}if(navigator.vibrate)navigator.vibrate([300,120,300])}
function stopS(){try{sn&&sn.forEach(x=>x.stop())}catch(e){}sn=null}

// Reverse Pomodoro Waste Check Loop
function checkReversePomodoro(){
  if(!S.revPm.on)return;
  if(!tm.run){
    const idleSec=Math.floor((Date.now()-(S.revPm.last||Date.now()))/1000);
    const limitSec=(S.revPm.idleLimit||15)*60;
    if(idleSec>limitSec){
      const wasteMin=Math.floor((idleSec-limitSec)/60);
      S.revPm.waste=wasteMin;
      if(Date.now()-(S.revPm.notified||0)>300000){
        S.revPm.notified=Date.now();
        banner(`⚠️ ALERT: ${wasteMin} min waste ho chuke hain! Padhai shuru karo.`,'warn');
        if(navigator.vibrate)navigator.vibrate([200,100,200]);
      }
    }else{
      S.revPm.waste=0;
    }
  }else{
    S.revPm.waste=0;
    S.revPm.last=Date.now();
  }
}

function repCheck(){
  const t=today(),m=nowM();let x=new Date((S.rv.since||t)+'T00:00:00'),last=null;
  for(let i=0;i<60;i++){
    const ds=ld(x);if(ds>t||(ds===t&&m<1439))break;
    if(!S.rv.rep[ds]){
      S.rv.rep[ds]={me:S.mins[ds]||0,rv:Math.round(rvM(ds,1440)),r:0,ch:planFor(ds).map(q=>q.t),seen:0};
      const p=S.rv.rep[ds];p.r=p.me>p.rv?'W':p.me<p.rv?'L':'D';last=ds;
    }
    x.setDate(x.getDate()+1);
  }
  if(last&&!S.rv.rep[last].seen){save();showRep(last)}
}

      S.mins[today()]=0;S.rv.lm={d:today(),m:nowM()};S.rv.sg=0;save();toast("Aaj ka muqabla zero kiya!");R();

      const wk=wkDates(0)[0];delete S.rv.bw[wk];wkDates(0).forEach(d=>S.mins[d]=0);save();toast("Hafte ka progress reset!");R();
